name: 构建 HA 加载项镜像

on:
  push:
    branches: [main]
    paths:
      - "frpc/**"
      - ".github/workflows/build-addon.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon_arch: aarch64
            buildx_platform: linux/arm64
          - addon_arch: amd64
            buildx_platform: linux/amd64
          - addon_arch: armv7
            buildx_platform: linux/arm/v7
          - addon_arch: armhf
            buildx_platform: linux/arm/v6
          - addon_arch: i386
            buildx_platform: linux/386
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./frpc
          file: ./frpc/Dockerfile
          platforms: ${{ matrix.buildx_platform }}
          push: true
          build-args: |
            FRP_VERSION=0.71.0
            BUILD_FROM=alpine:3.21
            BUILD_ARCH=${{ matrix.addon_arch }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.addon_arch }}-addon-ha_remote_frpc:1.0.0
