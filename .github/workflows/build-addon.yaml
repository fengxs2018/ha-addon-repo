name: 构建 HA 加载项镜像

# 不再依赖 home-assistant/builder（已 deprecated + 删了 --registry/--amd64/--i386 等参数），
# 直接用 docker buildx + QEMU + GHCR。

on:
  push:
    branches: [main]
    paths:
      - "frpc/**"
      - ".github/workflows/build-addon.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # HA 加载项的 arch 命名 -> docker buildx platform
        include:
          - addon_arch: aarch64
            buildx_platform: linux/arm64
          - addon_arch: amd64
            buildx_platform: linux/amd64
          - addon_arch: armv7
            buildx_platform: linux/arm/v7
          - addon_arch: armhf
            buildx_platform: linux/arm/v6
          # 注：frp v0.71.0 无 i386 二进制，暂停发布 i386 镜像
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ${{ matrix.addon_arch }}
        uses: docker/build-push-action@v5
        with:
          context: ./frpc
          file: ./frpc/Dockerfile
          platforms: ${{ matrix.buildx_platform }}
          push: true
          build-args: |
            FRP_VERSION=0.71.0
            BUILD_ARCH=${{ matrix.addon_arch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.addon_arch }}-addon-ha_remote_frpc:1.0.0
