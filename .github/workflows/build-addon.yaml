name: 构建 HA 加载项镜像

on:
  push:
    branches: [main]
    paths:
      - "frpc/**"
      - ".github/workflows/build-addon.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/{arch}-addon-ha_remote_frpc

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64, armv7, i386]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ${{ matrix.arch }}
        uses: home-assistant/builder@master
        with:
          args: |
            --target frpc \
            --${{ matrix.arch }} \
            --image "${{ env.IMAGE_BASE }}" \
            --docker-user ${{ github.actor }} \
            --docker-password ${{ secrets.GITHUB_TOKEN }} \
            --no-cache
